[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-strategy-lab"
version = "0.1.0"
description = "A local-first research and backtesting workspace for NSE equities"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "requests>=2.32",
    "streamlit>=1.54",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
nse-strategy-lab = "nse_strategy_lab.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
